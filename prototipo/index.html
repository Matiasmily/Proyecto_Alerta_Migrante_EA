<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerta Migrante – Prototipo v2</title>
<style>
:root{--bg:#e6edef;--bar:#0e5a55;--bar-t:#fff;--me:#d3efc6;--bot:#fff;--tx:#17252b;--mu:#5b6d75;--line:#c9d5d9;--hi:#b3261e;--me2:#b26a00;--lo:#1b7a3d;--hib:#fbe4e2;--meb:#fff0d6;--lob:#dff3e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1418;--bar:#0b3f3b;--me:#14493f;--bot:#1c2a31;--tx:#e8eef0;--mu:#93a6ae;--line:#2a3b43;--hi:#ff8a80;--me2:#ffc46b;--lo:#7fd99a;--hib:#3a1f1e;--meb:#3a2d12;--lob:#173324}}
:root[data-theme="dark"]{--bg:#0d1418;--bar:#0b3f3b;--me:#14493f;--bot:#1c2a31;--tx:#e8eef0;--mu:#93a6ae;--line:#2a3b43;--hi:#ff8a80;--me2:#ffc46b;--lo:#7fd99a;--hib:#3a1f1e;--meb:#3a2d12;--lob:#173324}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line);position:relative}
header{background:var(--bar);color:var(--bar-t);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:20px;flex:none}
header h1{font-size:17px;margin:0;font-weight:600}
header small{opacity:.8;font-size:12.5px}
.hb{display:flex;gap:6px;margin-left:auto}
header button{background:#ffffff22;color:inherit;border:0;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}
.b{max-width:88%;padding:9px 12px;border-radius:12px;box-shadow:0 1px 1px #0002;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.me{align-self:flex-end;background:var(--me);border-top-right-radius:3px}
.me img{max-width:220px;max-height:260px;border-radius:8px;display:block}
.bot{align-self:flex-start;background:var(--bot);border-top-left-radius:3px;white-space:normal}
.bot p{margin:0 0 8px}.bot p:last-child{margin:0}
.bot ul{margin:4px 0 8px;padding-left:20px}.bot li{margin:3px 0}
.badge{display:inline-block;font-weight:700;padding:5px 10px;border-radius:8px;margin-bottom:8px;font-size:15px}
.alto{background:var(--hib);color:var(--hi)}.medio{background:var(--meb);color:var(--me2)}.bajo{background:var(--lob);color:var(--lo)}
.sub{font-weight:600;margin:6px 0 2px}
.meter{height:10px;border-radius:5px;background:var(--line);margin:2px 0 4px;overflow:hidden}.meter i{display:block;height:100%;border-radius:5px}
.pts{font-size:13px;color:var(--mu);margin-bottom:6px}
.note{font-size:13px;color:var(--mu);border-top:1px solid var(--line);padding-top:7px;margin-top:8px}
.ocr{font-size:13.5px;color:var(--mu);background:var(--bg);border-radius:8px;padding:6px 9px;margin:4px 0 8px;white-space:pre-wrap;max-height:140px;overflow:auto}
.typing{color:var(--mu);font-style:italic}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.acts button{border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:14px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.qz{display:flex;gap:8px;margin-top:8px}
.qz button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:8px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.qz button:disabled{opacity:.5;cursor:default}
.quote{border-left:4px solid var(--line);padding:4px 10px;margin:6px 0;font-style:italic}
#chips{display:flex;gap:7px;overflow-x:auto;padding:8px 12px 2px}
#chips button{flex:none;border:1px solid var(--line);background:var(--bot);color:var(--tx);border-radius:16px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
#chips button.main{background:var(--bar);color:#fff;border-color:var(--bar)}
form{display:flex;gap:8px;padding:8px 12px 12px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bot);color:var(--tx);max-height:120px}
.rb{width:44px;height:44px;border:0;border-radius:50%;background:var(--bar);color:#fff;font-size:18px;cursor:pointer;flex:none}
#cam{background:var(--bot);color:var(--tx);border:1px solid var(--line)}
#panel{position:absolute;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}
#panel.on{display:flex}
.card{background:var(--bot);color:var(--tx);border-radius:16px;padding:20px;width:100%;max-width:400px}
.card h2{margin:0 0 4px;font-size:19px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.st{border-radius:12px;padding:10px 12px;background:var(--bg)}.st b{display:block;font-size:26px}.st span{font-size:13px;color:var(--mu)}
.card button{border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;background:var(--bar);color:#fff}
.card .sec{background:var(--bg);color:var(--tx);margin-right:6px}
button:focus-visible,textarea:focus-visible{outline:3px solid #2b8cff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="av" aria-hidden="true">🛡️</div>
<div><h1>Alerta Migrante</h1><small>Verificación de mensajes sospechosos · versión 2</small></div>
<div class="hb"><button id="stats" type="button" aria-label="Ver consultas">📊</button><button id="clear" type="button">Limpiar</button></div>
</header>
<div id="chat" aria-live="polite"></div>
<div id="chips"></div>
<form id="f">
<button id="cam" class="rb" type="button" aria-label="Enviar captura de pantalla">📷</button>
<input id="file" type="file" accept="image/*" hidden>
<textarea id="t" rows="1" placeholder="Pegue el mensaje, enlace o número" aria-label="Mensaje a verificar"></textarea>
<button id="send" class="rb" type="submit" aria-label="Enviar">➤</button>
</form>
<div id="panel" role="dialog" aria-modal="true" aria-labelledby="pt"><div class="card">
<h2 id="pt">📊 Consultas en este dispositivo</h2>
<div style="font-size:13.5px;color:var(--mu)">Solo se cuentan los resultados. Nunca se guarda el contenido de los mensajes.</div>
<div class="stats" id="sbox"></div>
<button class="sec" id="reset" type="button">Reiniciar</button><button id="close" type="button">Cerrar</button>
</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 1. Reglas de detección ---------- */
const RULES=[
{n:'Presiona con urgencia o amenazas de pérdida',p:15,re:/urgente|inmediat|ahora mismo|hoy mismo|ultimas horas|ultimo dia|24 horas|se vence|expira|de inmediato|bloquead|suspendid|cancelad|deportacion|multa/,tip:'Los estafadores usan la prisa para que no piense. Pare, respire y verifique antes de hacer nada.'},
{n:'Pide dinero, depósitos o pagos por adelantado',p:25,re:/deposit|transferen|western union|giro|adelanto|pago previo|pagar|cobro|tarifa|costo de (gestion|tramite)|\bq ?\d{2,}|\$ ?\d{2,}|\d+ ?(quetzales|dolares)/,tip:'Ningún trámite, empleo o premio legítimo se cobra por adelantado por WhatsApp. No envíe dinero.'},
{n:'Pide códigos, claves o contraseñas',p:35,re:/codigo de (verificacion|seguridad|6)|6 digitos|\bpin\b|contrasena|clave|\botp\b|codigo que (te |le )?(lleg|enviaron|mandaron)/,tip:'Nunca comparta el código de 6 dígitos de WhatsApp ni sus claves. Con eso le roban la cuenta.'},
{n:'Pide datos personales o fotos de documentos',p:15,re:/\bdpi\b|numero de (cuenta|tarjeta)|tarjeta|pasaporte|datos personales|foto de (su |tu )?(dpi|pasaporte)/,tip:'No mande fotos de documentos ni datos bancarios a quien no conoce o no ha verificado.'},
{n:'Habla de maletas, paquetes, premios o herencias',p:30,re:/maleta|paquete|aduana|encomienda|premio|ganaste|ganador|sorteo|herencia|regalo/,tip:'La estafa de la "maleta" o el "premio" pide pagos para liberar algo que no existe.'},
{n:'Ofrece empleo en el extranjero de forma sospechosa',p:25,re:/oferta (de )?(trabajo|empleo)|visa de trabajo|vacante|contrato (en|garantizado)|trabajo (en|garantizado)|sin experiencia|empleo (seguro|garantizado)|reclutamiento/,tip:'Desconfíe de ofertas "garantizadas". Busque la empresa por su cuenta y nunca pague por un contrato.'},
{n:'Menciona trámites migratorios o citas',p:10,re:/cita (en|con|para)|consulado|embajada|asilo|permiso de trabajo|gestor|tramite|residencia|parole|\bvisa\b/,tip:'Confirme los trámites solo en los sitios y teléfonos oficiales, que usted mismo busque.'},
{n:'Pide guardar el secreto',p:15,re:/no (le |les )?(digas|cuentes|compartas|avises) a nadie|confidencial|secreto/,tip:'Pedir secreto es señal clásica de engaño. Consulte con alguien de confianza.'},
{n:'Ofrece atajos o trámites más rápidos que lo oficial',p:15,re:/mas rapido|le salgo|te salgo|sin hacer (cola|fila)|sin cita|aprobacion (segura|garantizada)|tramite (rapido|express)|le ayudo con su tramite|conectes? en (inmigracion|migracion|el consulado)/,tip:'Los trámites migratorios se hacen solo por los canales oficiales. Desconfíe de gestores que prometen atajos.'},
{n:'Parece un familiar con número nuevo o en emergencia',p:25,re:/(nuevo|otro) numero|cambie de numero|tuve un accidente|estoy detenid|me detuvieron|me arrestaron|necesito (que me )?(ayudes|ayude|envies|mandes)/,tip:'Llame al familiar a su número de siempre antes de enviar dinero.'}
];

/* ---------- 2. Revisión de enlaces ---------- */
function urlsIn(t){return (t.match(/(https?:\/\/[^\s]+|www\.[^\s]+|\b[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|net|org|xyz|top|click|info|site|online|icu|live|link|co|gt|buzz)\b[^\s]*)/gi)||[]).filter(u=>!u.includes('@'));}
function hostOf(u){return u.replace(/^https?:\/\//i,'').split(/[\/?#]/)[0].toLowerCase();}
function checkUrl(u){
 const s=[],h=hostOf(u);let p=0;
 if(/^http:\/\//i.test(u)){p+=10;s.push('El enlace '+h+' no usa conexión segura (http)');}
 if(/(^|\.)(bit\.ly|tinyurl\.com|cutt\.ly|t\.co|is\.gd|rb\.gy|shorturl\.at)$/.test(h)){p+=20;s.push('Enlace acortado ('+h+'): no se ve a dónde lo lleva');}
 if(/\.(xyz|top|click|info|buzz|online|site|icu|live|link)$/.test(h)){p+=20;s.push('El dominio '+h+' termina en una extensión muy usada en fraudes');}
 if(/^\d{1,3}(\.\d{1,3}){3}$/.test(h)){p+=25;s.push('El enlace es una dirección numérica, no un sitio normal');}
 if((h.match(/-/g)||[]).length>=2){p+=10;s.push('El dominio '+h+' tiene muchos guiones, típico de sitios falsos');}
 if(/gob|migra|consulado|uscis|conamigua|banrural|banco|bantrab|remesa|visa/.test(u.toLowerCase())&&!/(\.gob\.gt|\.gov|\.org\.gt)$/.test(h)){p+=25;s.push('El enlace '+h+' aparenta ser oficial o bancario, pero no es un dominio .gob.gt ni .gov');}
 return{p,s};
}

/* ---------- 3. Revisión de números de teléfono ---------- */
const PAISES={'502':'Guatemala','1':'Estados Unidos o Canadá','52':'México','503':'El Salvador','504':'Honduras','505':'Nicaragua','506':'Costa Rica','507':'Panamá','34':'España'};
const RAROS={'234':'Nigeria','92':'Pakistán','62':'Indonesia','855':'Camboya','880':'Bangladés','84':'Vietnam','91':'India','44':'Reino Unido','27':'Sudáfrica','233':'Ghana','63':'Filipinas','95':'Myanmar'};
function phonesIn(t){
 return (t.match(/(\+|\b00)?\(?\d[\d\s().-]{6,}\d/g)||[]).map(x=>x.trim()).filter(x=>{
  const d=x.replace(/\D/g,'');return d.length>=8&&d.length<=15&&!/^\d{1,3}(\.\d{1,3}){3}$/.test(x);});
}
function checkPhone(raw){
 const d=raw.replace(/\D/g,''),intl=raw.startsWith('+')||raw.startsWith('00');
 const n=raw.startsWith('00')?d.slice(2):d;
 let pais=null,p=0;const s=[];
 if(!intl&&d.length===8)pais='Guatemala';
 else if(intl||d.length>10){
  for(const L of [3,2,1]){const c=n.slice(0,L);
   if(PAISES[c]){pais=PAISES[c];break;}
   if(RAROS[c]){pais=RAROS[c];p=20;s.push('El número '+raw+' es de '+RAROS[c]+', un país muy usado en estafas por WhatsApp');break;}}
  if(!pais){pais='otro país';p=15;s.push('El número '+raw+' tiene un código de país poco común');}
 } else pais=d.length===10?'posiblemente Estados Unidos (sin código +1)':'no identificado';
 return{raw,pais,p,s};
}

/* ---------- 4. Análisis completo ---------- */
function analyze(text){
 const t=norm(text),sig=[],tips=[];let score=0;
 RULES.forEach(r=>{if(r.re.test(t)){score+=r.p;sig.push(r.n);tips.push(r.tip);}});
 const urls=urlsIn(text);
 urls.forEach(u=>{const c=checkUrl(u);score+=c.p;c.s.forEach(x=>sig.push(x));});
 const phones=phonesIn(text).map(checkPhone);
 phones.forEach(ph=>{score+=ph.p;ph.s.forEach(x=>sig.push(x));});
 score=Math.min(100,score);
 const lvl=score>=50?'alto':score>=20?'medio':'bajo';
 const soloNumero=phones.length>0&&text.replace(/[\d\s+().-]/g,'').trim().length<3;
 return{score,lvl,sig,tips:[...new Set(tips)],urls,phones,soloNumero};
}

/* ---------- 5. Contador de consultas (solo resultados, nunca el contenido) ---------- */
const mem={total:0,alto:0,medio:0,bajo:0,capturas:0,aciertos:0,preguntas:0};
function loadStats(){try{Object.assign(mem,JSON.parse(localStorage.getItem('am_stats')||'{}'));}catch(e){}}
function saveStats(){try{localStorage.setItem('am_stats',JSON.stringify(mem));}catch(e){}}
function count(k){mem[k]++;saveStats();}

/* ---------- 6. Respuesta del bot ---------- */
const LBL={alto:'🔴 Riesgo ALTO: muy probable estafa',medio:'🟠 Riesgo MEDIO: tenga cuidado',bajo:'🟢 Riesgo BAJO: no vi señales claras'};
const COL={alto:'var(--hi)',medio:'var(--me2)',bajo:'var(--lo)'};
function botReply(text,ocrText){
 const a=analyze(text);count('total');count(a.lvl);
 const d=document.createElement('div');d.className='b bot';
 let h='';
 if(ocrText!=null)h+='<div class="sub">📷 Texto que leí en la captura:</div><div class="ocr">'+esc(ocrText)+'</div>';
 h+='<span class="badge '+a.lvl+'">'+LBL[a.lvl]+'</span><div class="meter"><i style="width:'+Math.max(4,a.score)+'%;background:'+COL[a.lvl]+'"></i></div><div class="pts">Puntaje de riesgo: '+a.score+' de 100</div>';
 if(a.sig.length)h+='<div class="sub">Señales que encontré:</div><ul>'+a.sig.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
 if(a.phones.length)h+='<div class="sub">📞 Números que revisé:</div><ul>'+a.phones.map(p=>'<li>'+esc(p.raw)+' → '+esc(p.pais)+'</li>').join('')+'</ul>';
 h+='<div class="sub">Qué hacer:</div><ul>';
 if(a.lvl==='alto')h+='<li><b>No responda, no pague y no abra enlaces.</b></li><li>Bloquee y reporte el número en WhatsApp.</li><li>Si ya dio datos o dinero, avise a su banco y pida orientación al Ministerio Público o a la PDH.</li>';
 else if(a.lvl==='medio')h+='<li>No haga ningún pago ni comparta datos todavía.</li><li>Confirme por otro medio (llame usted mismo al número oficial o al familiar).</li>';
 else h+='<li>Aun así, si le piden dinero o datos, vuelva a consultarme.</li>';
 a.tips.slice(0,3).forEach(x=>h+='<li>'+esc(x)+'</li>');
 if(a.soloNumero)h+='<li>No puedo saber a quién pertenece un número. Si no lo conoce, no atienda pedidos de dinero y verifique llamando usted al número oficial o al familiar.</li>';
 h+='</ul>';
 if(a.urls.length&&a.lvl==='bajo')h+='<p>Ojo: un enlace sin señales raras <b>no significa que sea seguro</b>. Si no lo esperaba, no lo abra.</p>';
 h+='<div class="note">Esto es una orientación basada en señales, no una garantía de que el mensaje sea legítimo o falso. Su mensaje se analiza solo en este dispositivo y no se guarda.</div>';
 h+='<div class="acts"><button type="button" data-a="voz">🔊 Escuchar</button>'+(a.lvl!=='bajo'?'<button type="button" data-a="avisar">📤 Avisar a mi familia</button>':'')+'</div>';
 d.innerHTML=h;
 d.querySelector('[data-a="voz"]').onclick=()=>speak(d);
 const av=d.querySelector('[data-a="avisar"]');
 if(av)av.onclick=()=>{
  const msg='⚠️ Alerta Migrante: me llegó un mensaje que parece estafa (riesgo '+a.lvl.toUpperCase()+').\nSeñales: '+a.sig.slice(0,3).join('; ')+'.\nSi te llega algo parecido: no pagues, no compartas códigos ni datos, y llámame antes de hacer algo.';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');
 };
 return d;
}

/* ---------- 7. Lectura en voz alta (accesibilidad) ---------- */
function speak(el){
 if(!('speechSynthesis' in window)){alert('Este navegador no puede leer en voz alta.');return;}
 speechSynthesis.cancel();
 const c=el.cloneNode(true);c.querySelectorAll('.acts,.note,.meter,.ocr').forEach(x=>x.remove());
 const u=new SpeechSynthesisUtterance(c.innerText.replace(/[🔴🟠🟢📷📞💡🎓✅❌🏁]/gu,''));u.lang='es-MX';u.rate=.95;
 const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('es'));if(v)u.voice=v;
 speechSynthesis.speak(u);
}

/* ---------- 8. Chat ---------- */
const chat=$('chat');
function add(el){chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
function say(t,cls){const d=document.createElement('div');d.className='b '+cls;d.textContent=t;add(d);return d;}
function typing(t){const d=document.createElement('div');d.className='b bot typing';d.textContent=t||'Revisando…';add(d);return d;}
function welcome(){
 const d=document.createElement('div');d.className='b bot';
 d.innerHTML='<p>¡Hola! Soy <b>Alerta Migrante</b>. Le ayudo a revisar si un mensaje, enlace o número es sospechoso antes de que haga algo.</p><p>Puede:</p><ul><li>✍️ <b>Pegar</b> el mensaje o el número que le llegó.</li><li>📷 <b>Mandar una captura</b> de pantalla del mensaje.</li><li>🎓 <b>Practicar</b> para aprender a reconocer estafas.</li></ul><p>💡 <b>Recuerde:</b> ningún trámite, empleo o premio real le pide pagar por adelantado ni el código de su WhatsApp.</p>';
 add(d);
}
function send(text){
 text=text.trim();if(!text)return;
 say(text,'me');const ty=typing();
 setTimeout(()=>{ty.remove();add(botReply(text));},650);
}

/* ---------- 9. Lectura de capturas de pantalla (OCR) ---------- */
let tessP=null;
function loadTess(){
 if(window.Tesseract)return Promise.resolve();
 if(!tessP)tessP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>{tessP=null;no(new Error('sin conexión'));};document.head.appendChild(s);});
 return tessP;
}
async function handleImage(file){
 if(!file)return;
 const url=URL.createObjectURL(file);
 const me=document.createElement('div');me.className='b me';const im=document.createElement('img');im.src=url;im.alt='Captura enviada';me.appendChild(im);add(me);
 const ty=typing('📷 Leyendo la captura… (puede tardar unos segundos)');
 try{
  await loadTess();
  const r=await Tesseract.recognize(file,'spa');
  const txt=(r.data.text||'').replace(/\n{2,}/g,'\n').trim();
  ty.remove();count('capturas');
  if(txt.length<5){say('No pude leer texto en esa imagen. Intente con una captura más clara o pegue el mensaje como texto.','bot');return;}
  add(botReply(txt,txt));
 }catch(e){
  ty.remove();
  say('No pude leer la captura. Esta función necesita conexión a Internet. Mientras tanto, copie y pegue el texto del mensaje.','bot');
 }
}
$('cam').onclick=()=>$('file').click();
$('file').onchange=e=>{handleImage(e.target.files[0]);e.target.value='';};

/* ---------- 10. Modo práctica ---------- */
const QUIZ=[
 {m:'Hola, soy de la aduana. Su familiar le envió una maleta desde EE. UU. Para liberarla debe depositar Q850 hoy mismo. No le diga a nadie.',e:true},
 {m:'Hola tía, ya llegué bien al trabajo. Más tarde te llamo.',e:false},
 {m:'Te envié por error un código de 6 dígitos a tu WhatsApp, ¿me lo puedes pasar? Es urgente.',e:true},
 {m:'OFERTA DE TRABAJO en Texas, contrato garantizado, sin experiencia. Pague $150 de gestión: empleo-usa-visa.top',e:true},
 {m:'Mamá, este es mi nuevo número. Tuve un accidente, mándame Q2000 por Western Union.',e:true},
 {m:'Recordatorio: su cita en el consulado es el lunes. Verifique los datos solo en el sitio oficial del gobierno.',e:false}
];
let qi=-1,qok=0;
function startQuiz(){
 qi=0;qok=0;
 const d=document.createElement('div');d.className='b bot';
 d.innerHTML='<p>🎓 <b>¡Vamos a practicar!</b> Le mostraré '+QUIZ.length+' mensajes. Dígame si cree que es estafa o no.</p>';add(d);
 setTimeout(askQ,500);
}
function askQ(){
 const q=QUIZ[qi],d=document.createElement('div');d.className='b bot';
 d.innerHTML='<div class="sub">Mensaje '+(qi+1)+' de '+QUIZ.length+':</div><div class="quote">'+esc(q.m)+'</div><div class="qz"><button type="button" data-v="1">🚫 Es estafa</button><button type="button" data-v="0">✅ No es estafa</button></div>';
 d.querySelectorAll('.qz button').forEach(b=>b.onclick=()=>{d.querySelectorAll('.qz button').forEach(x=>x.disabled=true);answer(b.dataset.v==='1',b.textContent);});
 add(d);
}
function answer(v,label){
 const q=QUIZ[qi],ok=v===q.e;if(ok)qok++;count('preguntas');if(ok)count('aciertos');
 say(label,'me');
 const a=analyze(q.m),d=document.createElement('div');d.className='b bot';
 let h='<p><b>'+(ok?'✅ ¡Correcto!':'❌ No exactamente.')+'</b> '+(q.e?'Este mensaje <b>sí es estafa</b>.':'Este mensaje <b>no tiene señales de estafa</b>.')+'</p>';
 if(q.e&&a.sig.length)h+='<div class="sub">Las señales eran:</div><ul>'+a.sig.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
 if(!q.e)h+='<p>No pide dinero, códigos ni datos, y no le apura. Aun así, si algo no le cuadra, confirme por otro medio.</p>';
 d.innerHTML=h;
 setTimeout(()=>{
  add(d);qi++;
  if(qi<QUIZ.length){setTimeout(askQ,700);return;}
  setTimeout(()=>{
   const f=document.createElement('div');f.className='b bot';
   const msg=qok===QUIZ.length?'¡Excelente! Reconoce muy bien las estafas.':qok>=4?'¡Muy bien! Ya reconoce la mayoría de señales.':'Siga practicando: fíjese en la urgencia, los cobros y los códigos.';
   f.innerHTML='<p>🏁 <b>Resultado: '+qok+' de '+QUIZ.length+' correctas.</b></p><p>'+msg+'</p><div class="acts"><button type="button">🔁 Practicar otra vez</button></div>';
   f.querySelector('button').onclick=startQuiz;add(f);qi=-1;
  },700);
 },400);
}

/* ---------- 12. Panel de consultas ---------- */
function showStats(){
 const pct=mem.preguntas?Math.round(mem.aciertos*100/mem.preguntas)+'%':'—';
 $('sbox').innerHTML=[['Consultas',mem.total],['Riesgo alto',mem.alto],['Riesgo medio',mem.medio],['Riesgo bajo',mem.bajo],['Capturas leídas',mem.capturas],['Aciertos en práctica',pct]].map(([k,v])=>'<div class="st"><b>'+v+'</b><span>'+k+'</span></div>').join('');
 $('panel').classList.add('on');$('close').focus();
}
$('stats').onclick=showStats;$('close').onclick=()=>$('panel').classList.remove('on');
$('panel').onclick=e=>{if(e.target.id==='panel')$('panel').classList.remove('on');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('panel').classList.remove('on');});
$('reset').onclick=()=>{Object.keys(mem).forEach(k=>mem[k]=0);saveStats();showStats();};

$('f').addEventListener('submit',e=>{e.preventDefault();send($('t').value);$('t').value='';$('t').style.height='auto';});
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit();}});
$('t').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';});
$('clear').onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();chat.innerHTML='';qi=-1;welcome();};
loadStats();welcome();
